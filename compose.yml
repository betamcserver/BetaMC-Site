services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - gradle-project:/app/.gradle
      - gradle-build:/app/build
      - gradle-cache:/root/.gradle

volumes:
  gradle-project:
  gradle-build:
  gradle-cache:
